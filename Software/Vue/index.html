<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CareBed 平台演示系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1.5.10/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7Q8Y7bQAnNJo7XU9lrw==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
<div id="app">
    <section class="hero">
        <div class="hero-inner">
            <div class="hero-legend">
                <span class="eyebrow">CAREBED PLATFORM</span>
                <h1>{{ session.token ? '欢迎回来，' + session.displayName : '智慧陪护床运营演示系统' }}</h1>
                <p>{{ session.token ? '当前会话已激活，可随时执行操作。' : '统一体验覆盖登录、设备、租借、钱包、报修与通知模块。' }}</p>
            </div>
            <div class="hero-meta">
                <div class="chip">Spring Boot · Vue</div>
                <div class="hero-meta-group">
                    <span class="chip">REST API</span>
                    <span class="chip">MQTT Broker</span>
                    <span class="chip" v-if="logs.length">API 日志 {{ logs.length }}</span>
                </div>
            </div>
        </div>
    </section>

    <main class="app-shell" :class="{ 'has-mobile-nav': mobileNavVisible }">
        <article class="card auth-card" v-if="!session.token">
            <div class="auth-switch">
                <button type="button" :class="{ active: authCard === 'login' }" @click="switchAuthCard('login')">登录账号</button>
                <button type="button" :class="{ active: authCard === 'register' }" @click="switchAuthCard('register')">注册账号</button>
            </div>

            <template v-if="authCard === 'login'">
                <h2>账号登录</h2>
                <p>使用已有账号登录，进入客户或运营控制台。</p>
                <form @submit.prevent="handleLogin" class="stack">
                    <label>
                        用户名
                        <input type="text" v-model="loginForm.username" placeholder="请输入用户名" required>
                    </label>
                    <label>
                        密码
                        <input type="password" v-model="loginForm.password" placeholder="请输入密码" required>
                    </label>
                    <button type="submit">登录</button>
                </form>
                <p class="auth-hint">
                    还没有账号？
                    <button type="button" class="link-button" @click="switchAuthCard('register')">立即注册</button>
                </p>
            </template>

            <template v-else>
                <h2>注册新账号</h2>
                <p>填写资料即可创建账号，完成后系统会自动为你登录。</p>
                <form @submit.prevent="handleRegister" class="stack">
                    <label>
                        用户名
                        <input type="text" v-model="registerForm.username" placeholder="请输入用户名" required>
                    </label>
                    <label>
                        密码
                        <input type="password" v-model="registerForm.password" placeholder="请输入密码" required>
                    </label>
                    <label>
                        角色
                        <select v-model="registerForm.role">
                            <option value="FAMILY">陪护家属</option>
                            <option value="ADMIN">运营管理员</option>
                        </select>
                    </label>
                    <template v-if="registerForm.role === 'ADMIN'">
                        <label>
                            默认管理员账号
                            <input type="text" v-model="registerForm.adminUsername" placeholder="请输入默认管理员账号" required>
                        </label>
                        <label>
                            默认管理员密码
                            <input type="password" v-model="registerForm.adminPassword" placeholder="请输入默认管理员密码" required>
                        </label>
                    </template>
                    <label>
                        姓名
                        <input type="text" v-model="registerForm.fullName" placeholder="请输入姓名" required>
                    </label>
                    <label>
                        手机号
                        <input type="tel" v-model="registerForm.phone" placeholder="请输入手机号" required>
                    </label>
                    <button type="submit">注册并登录</button>
                </form>
                <p class="auth-hint">
                    已有账号？
                    <button type="button" class="link-button" @click="switchAuthCard('login')">返回登录</button>
                </p>
            </template>
        </article>

        <template v-else>
            <div class="dashboard-shell">
                <aside class="session-panel">
                    <article class="card" v-if="showTokenCard">
                        <div class="panel-heading">
                            <h2>{{ session.displayName }}</h2>
                            <p>{{ session.role }}</p>
                        </div>
                        <p class="token-preview">Token 快照：{{ tokenPreview }}</p>
                        <details class="token-details">
                            <summary>展开查看完整 Token</summary>
                            <code>{{ session.token }}</code>
                        </details>
                    </article>
                    <article class="card" v-if="showWorkspaceCard">
                        <h3>工作区</h3>
                        <div class="area-tabs">
                            <button @click="switchArea('customer')" :class="{ secondary: activeArea !== 'customer' }" v-if="canSeeCustomer">客户门户</button>
                            <button @click="switchArea('admin')" :class="{ secondary: activeArea !== 'admin' }" v-if="canSeeAdmin">管理后台</button>
                        </div>
                        <div class="session-actions">
                            <button @click="activeArea === 'customer' ? loadCustomerDashboard() : loadAdminDashboard()">刷新当前视图</button>
                            <button class="secondary" @click="logout">退出登录</button>
                        </div>
                        <ul class="session-stats" v-if="sessionHighlights.length">
                            <li v-for="item in sessionHighlights" :key="item">{{ item }}</li>
                        </ul>
                    </article>
                </aside>

                <section class="area-content">
                    <section class="area-pane" v-if="activeArea === 'customer' && canSeeCustomer">
                        <article class="card area-header-card">
                            <div class="area-header-top">
                                <h2>客户门户</h2>
                                <div class="time-indicator">当前北京时间：{{ beijingTime }}</div>
                            </div>
                            <p class="area-header-sub">实时同步钱包、租借、报修与消息，协助陪护家属完成自助操作。</p>
                        </article>
                        <div class="area-grid">
                            <article class="card" v-if="showMobileSection('mine')">
                                <div class="section-title">
                                    <h3>钱包与充值</h3>
                                    <button class="btn-refresh" @click="refreshWallet">刷新</button>
                                </div>
                                <p v-if="customer.wallet">
                                    当前余额：<strong>{{ formatNumber(customer.wallet.balance) }} 元</strong>
                                    <br>
                                    <span class="muted">最近更新：{{ formatTime(customer.wallet.updatedAt) }}</span>
                                </p>
                                <p v-else class="muted">尚未拉取钱包信息，点击刷新即可同步。</p>
                                <form class="form-inline" style="margin-top:1rem;" @submit.prevent="submitRecharge">
                                    <label>
                                        充值金额
                                        <input type="number" min="1" step="1" v-model.number="customer.rechargeAmount" required>
                                    </label>
                                    <button type="submit">充值</button>
                                </form>
                                <h4 style="margin-top:1.25rem;">交易记录</h4>
                                <table v-if="customer.wallet && customer.wallet.transactions.length">
                                    <thead>
                                        <tr>
                                            <th>时间</th>
                                            <th>类型</th>
                                            <th>金额</th>
                                            <th>备注</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="txn in pagedWalletTransactions" :key="txn.id">
                                            <td>{{ formatTime(txn.occurredAt) }}</td>
                                            <td>{{ txn.type }}</td>
                                            <td>{{ formatNumber(txn.amount) }}</td>
                                            <td>{{ txn.reference || txn.notes }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div class="pager" v-if="transactionsTotalPages > 1">
                                    <button type="button" class="secondary" :disabled="pagination.transactions === 1" @click="changePage('transactions', -1, transactionsTotalPages)">上一页</button>
                                    <span class="pager-info">第 {{ pagination.transactions }} / {{ transactionsTotalPages }} 页</span>
                                    <button type="button" class="secondary" :disabled="pagination.transactions === transactionsTotalPages" @click="changePage('transactions', 1, transactionsTotalPages)">下一页</button>
                                </div>
                                <p v-else class="muted">暂无交易记录。</p>
                                <h4 style="margin-top:1.25rem;">费用争议</h4>
                                <form class="stack" @submit.prevent="submitDispute">
                                    <label>
                                        订单号
                                        <input type="text" v-model="customer.disputeForm.orderId" placeholder="租借订单号" required>
                                    </label>
                                    <label>
                                        申诉原因
                                        <textarea rows="3" v-model="customer.disputeForm.reason" required></textarea>
                                    </label>
                                    <button type="submit">提交争议</button>
                                </form>
                                <ul class="list-plain" style="margin-top:1rem;">
                                    <li v-for="dispute in customer.disputes" :key="dispute.id">
                                        <strong>{{ dispute.orderId }}</strong> · {{ dispute.status }}
                                        <div class="muted">{{ dispute.reason }}</div>
                                    </li>
                                </ul>
                            </article>

                            <article class="card horizontal-card" v-if="showMobileSection('devices')">
                                <div class="section-title">
                                    <h3>设备列表</h3>
                                    <button class="btn-refresh" @click="refreshCustomerDevices">刷新</button>
                                </div>
                                <div class="horizontal-content">
                                    <p class="muted">展示当前所有设备状态，便于挑选可租借的设备。</p>
                                    <ul class="list-plain device-list">
                                        <li v-for="device in pagedCustomerDevices" :key="device.id">
                                            <span class="status-dot" :class="`status-${device.status}`"></span>
                                            <div class="device-entry-head">
                                                <strong>{{ device.deviceCode }}</strong>
                                                <span class="badge">{{ displayDeviceStatus(device.status) }}</span>
                                            </div>
                                            <div class="muted">{{ device.ward }} · 床位 {{ device.bedNumber }}</div>
                                            <div class="muted">状态：{{ displayLockStatus(device.lockStatus, device.status) }}</div>
                                        </li>
                                    </ul>
                                    <div class="pager" v-if="devicesTotalPages > 1">
                                        <button type="button" class="secondary" :disabled="pagination.devices === 1" @click="changePage('devices', -1, devicesTotalPages)">上一页</button>
                                        <span class="pager-info">第 {{ pagination.devices }} / {{ devicesTotalPages }} 页</span>
                                        <button type="button" class="secondary" :disabled="pagination.devices === devicesTotalPages" @click="changePage('devices', 1, devicesTotalPages)">下一页</button>
                                    </div>
                                </div>
                            </article>

                            <article class="card" v-if="showMobileSection('devices')">
                                <div class="section-title">
                                    <h3>快速租借</h3>
                                </div>
                                <p v-if="lockedDeviceCode && !isAdmin" class="muted" style="margin:0;">已锁定设备：{{ lockedDeviceCode }}（来源二维码）</p>
                                <form class="stack" @submit.prevent="startRental">
                                    <label>
                                        设备编号
                                        <input type="text" v-model="customer.rentalForm.deviceCode" placeholder="BED-0001" required :disabled="!!lockedDeviceCode && !isAdmin">
                                    </label>
                                    <label>
                                        预期租借时长（小时）
                                        <input type="number" min="1" max="14" v-model.number="customer.rentalForm.expectedHours" required>
                                    </label>
                                    <button type="submit">发起租借</button>
                                </form>
                            </article>

                            <article class="card" v-if="showMobileSection('orders')">
                                <div class="section-title">
                                    <h3>租借记录</h3>
                                </div>
                                <table class="table-compact rentals-table">
                                    <thead>
                                        <tr>
                                            <th class="nowrap">订单号</th>
                                            <th>状态</th>
                                            <th class="nowrap">时长</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template v-for="rental in pagedCustomerRentals" :key="rental.id">
                                            <tr>
                                                <td class="nowrap">{{ rentalShortId(rental.id) }}</td>
                                                <td>{{ displayRentalStatus(rental.status) }}</td>
                                                <td class="nowrap">{{ rentalDuration(rental) }}</td>
                                                <td>
                                                    <button type="button" class="rental-detail-toggle" @click="toggleRentalDetails(rental.id)">
                                                        {{ isRentalExpanded(rental.id) ? '收起' : '详情' }}
                                                    </button>
                                                </td>
                                            </tr>
                                            <tr v-if="isRentalExpanded(rental.id)" class="rental-detail-row">
                                                <td colspan="4">
                                                    <div class="rental-detail">
                                                        <p><strong>完整订单号：</strong>{{ rental.id }}</p>
                                                        <p><strong>设备编号：</strong>{{ rental.deviceCode }}</p>
                                                        <p><strong>计费金额：</strong>{{ formatNumber(rental.amount) }} 元</p>
                                                        <p><strong>开始时间：</strong>{{ formatTime(rental.startedAt) }}</p>
                                                        <p v-if="rental.expectedEndAt"><strong>预期结束：</strong>{{ formatTime(rental.expectedEndAt) }}</p>
                                                        <p v-if="rental.endedAt"><strong>归还时间：</strong>{{ formatTime(rental.endedAt) }}</p>
                                                        <div class="rental-actions">
                                                            <button v-if="canUnlockRental(rental)" @click="unlockRental(rental)" class="secondary">开锁</button>
                                                            <button v-if="rental.status === 'ACTIVE'" @click="returnRental(rental.id)" class="secondary">归还</button>
                                                            <button v-if="rental.status === 'ACTIVE' && canCancelRental(rental)" @click="cancelRentalUser(rental.id)" class="secondary">取消</button>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                                <div class="pager" v-if="rentalsTotalPages > 1">
                                    <button type="button" class="secondary" :disabled="pagination.rentals === 1" @click="changePage('rentals', -1, rentalsTotalPages)">上一页</button>
                                    <span class="pager-info">第 {{ pagination.rentals }} / {{ rentalsTotalPages }} 页</span>
                                    <button type="button" class="secondary" :disabled="pagination.rentals === rentalsTotalPages" @click="changePage('rentals', 1, rentalsTotalPages)">下一页</button>
                                </div>
                            </article>

                            <article class="card horizontal-card" v-if="showMobileSection('orders')">
                                <div class="section-title">
                                    <h3>报修中心</h3>
                                    <button class="btn-refresh" @click="refreshCustomerRepairs">刷新</button>
                                </div>
                                <div class="horizontal-content">
                                    <form class="stack" @submit.prevent="submitRepairTicket">
                                        <label>
                                            租借订单
                                            <select v-model="customer.repairForm.rentalId" required>
                                                <option value="">选择租借订单</option>
                                                <option v-for="rental in customer.rentals" :key="rental.id" :value="rental.id">
                                                    {{ rental.deviceCode }} · {{ rental.status }}
                                                </option>
                                            </select>
                                        </label>
                                        <label>
                                            故障描述
                                            <textarea rows="3" v-model="customer.repairForm.description" required></textarea>
                                        </label>
                                        <label>
                                            照片链接（逗号分隔，可选）
                                            <input type="text" v-model="customer.repairForm.photos" placeholder="https://...">
                                        </label>
                                        <button type="submit">提交报修</button>
                                    </form>
                                    <div class="stack" style="margin:0;">
                                        <h4 style="margin:0;">报修进度</h4>
                                        <ul class="list-plain">
                                            <li v-for="ticket in pagedCustomerRepairs" :key="ticket.id">
                                                <strong>{{ ticket.deviceCode }}</strong> · {{ ticket.status }}
                                                <div class="muted">提交时间：{{ formatTime(ticket.createdAt) }}</div>
                                                <div class="muted" v-if="ticket.resolution">处理说明：{{ ticket.resolution }}</div>
                                            </li>
                                        </ul>
                                        <div class="pager" v-if="repairsTotalPages > 1">
                                            <button type="button" class="secondary" :disabled="pagination.repairs === 1" @click="changePage('repairs', -1, repairsTotalPages)">上一页</button>
                                            <span class="pager-info">第 {{ pagination.repairs }} / {{ repairsTotalPages }} 页</span>
                                            <button type="button" class="secondary" :disabled="pagination.repairs === repairsTotalPages" @click="changePage('repairs', 1, repairsTotalPages)">下一页</button>
                                        </div>
                                    </div>
                                </div>
                            </article>

                            <article class="card horizontal-card" v-if="showMobileSection('messages')">
                                <div class="section-title">
                                    <h3>通知中心</h3>
                                    <div class="pill-select">
                                        <button @click="customer.messageFilter = 'all'" :class="{ secondary: customer.messageFilter !== 'all' }">全部</button>
                                        <button @click="customer.messageFilter = 'unread'" :class="{ secondary: customer.messageFilter !== 'unread' }">未读</button>
                                        <button class="btn-refresh" @click="refreshCustomerMessages">刷新</button>
                                    </div>
                                </div>
                                <div class="horizontal-content">
                                    <p class="muted">集中展示系统推送通知，可快速筛选未读消息并标记处理。</p>
                                    <ul class="list-plain">
                                        <li v-for="msg in pagedCustomerMessages" :key="msg.id">
                                            <div>
                                                <strong>{{ msg.title }}</strong>
                                                <span class="badge">{{ msg.type }}</span>
                                            </div>
                                            <div class="muted">{{ formatTime(msg.createdAt) }}</div>
                                            <p>{{ msg.content }}</p>
                                            <button v-if="!msg.read" class="secondary" @click="markMessageRead(msg.id)">标记已读</button>
                                        </li>
                                    </ul>
                                    <div class="pager" v-if="messagesTotalPages > 1">
                                        <button type="button" class="secondary" :disabled="pagination.messages === 1" @click="changePage('messages', -1, messagesTotalPages)">上一页</button>
                                        <span class="pager-info">第 {{ pagination.messages }} / {{ messagesTotalPages }} 页</span>
                                        <button type="button" class="secondary" :disabled="pagination.messages === messagesTotalPages" @click="changePage('messages', 1, messagesTotalPages)">下一页</button>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </section>

                    <section class="area-pane" v-if="activeArea === 'admin' && canSeeAdmin">
                        <article class="card area-header-card">
                            <div class="area-header-top">
                                <h2>管理后台</h2>
                                <div class="time-indicator">当前北京时间：{{ beijingTime }}</div>
                            </div>
                            <p class="area-header-sub">掌握运营指标、设备状态与租借流程，支持远程维护与通知广播。</p>
                        </article>
                        <div class="area-grid">
                            <article class="card">
                                <div class="section-title">
                                    <h3>运营总览</h3>
                                    <button class="btn-refresh" @click="refreshAdminOverview">刷新</button>
                                </div>
                                <p v-if="!admin.overview" class="muted">点击刷新拉取最新概览指标。</p>
                                <div v-else class="stack">
                                    <div>
                                        <strong>用户</strong>
                                        <div class="muted">总数 {{ admin.overview.totalUsers }} · 家属 {{ admin.overview.familyUsers }} · 管理员 {{ admin.overview.adminUsers }}</div>
                                    </div>
                                    <div>
                                        <strong>设备</strong>
                                        <div class="muted">总数 {{ admin.overview.totalDevices }} · 可用 {{ admin.overview.availableDevices }} · 使用中 {{ admin.overview.inUseDevices }} · 维修 {{ admin.overview.maintenanceDevices }} · 离线 {{ admin.overview.offlineDevices }}</div>
                                    </div>
                                    <div>
                                        <strong>租借</strong>
                                        <div class="muted">进行中 {{ admin.overview.activeRentals }} · 已完成 {{ admin.overview.completedRentals }} · 逾期 {{ admin.overview.overdueRentals }} · 已取消 {{ admin.overview.canceledRentals }}</div>
                                    </div>
                                    <div>
                                        <strong>财务</strong>
                                        <div class="muted">累计收入 {{ formatNumber(admin.overview.totalRevenue) }} 元 · 钱包余额 {{ formatNumber(admin.overview.walletBalance) }} 元</div>
                                    </div>
                                    <div>
                                        <strong>维修</strong>
                                        <div class="muted">待处理 {{ admin.overview.openRepairs }} · 已解决 {{ admin.overview.resolvedRepairs }}</div>
                                    </div>
                                </div>
                            </article>

                            <article class="card grid-span-full">
                                <div class="section-title">
                                    <h3>趋势分析</h3>
                                    <button class="btn-refresh" @click="refreshAdminAnalytics">刷新</button>
                                </div>
                                <h4>使用趋势</h4>
                                <table v-if="admin.analytics && admin.analytics.usageTrend.length">
                                    <thead>
                                        <tr><th>时间</th><th>数值</th></tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="point in admin.analytics.usageTrend" :key="point.timestamp">
                                            <td>{{ formatTime(point.timestamp) }}</td>
                                            <td>{{ formatNumber(point.value) }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p v-else class="muted">暂无使用趋势数据。</p>
                                <h4 style="margin-top:1.25rem;">营收趋势</h4>
                                <table v-if="admin.analytics && admin.analytics.revenueTrend.length">
                                    <thead>
                                        <tr><th>时间</th><th>金额</th></tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="point in admin.analytics.revenueTrend" :key="point.timestamp + '-rev'">
                                            <td>{{ formatTime(point.timestamp) }}</td>
                                            <td>{{ formatNumber(point.value) }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <p v-else class="muted">暂无营收趋势数据。</p>
                            </article>

                            <article class="card grid-span-full">
                                <div class="section-title">
                                    <h3>设备管理</h3>
                                    <div class="button-row">
                                        <select v-model="admin.deviceFilter">
                                            <option value="">全部状态</option>
                                            <option v-for="status in enums.deviceStatuses" :key="status" :value="status">{{ displayDeviceStatus(status) }}</option>
                                        </select>
                                        <button class="btn-refresh" @click="refreshAdminDevices">刷新</button>
                                    </div>
                                </div>
                                <form class="form-inline" @submit.prevent="registerDevice">
                                    <label>
                                        设备编号
                                        <input type="text" v-model="admin.newDevice.deviceCode" placeholder="BED-0008" required>
                                    </label>
                                    <label>
                                        病区
                                        <input type="text" v-model="admin.newDevice.ward" placeholder="心内科" required>
                                    </label>
                                    <label>
                                        床位号
                                        <input type="text" v-model="admin.newDevice.bedNumber" placeholder="12A" required>
                                    </label>
                                    <button type="submit">登记新设备</button>
                                </form>
                                <form class="form-inline" style="margin-top:1rem;" @submit.prevent="updateDevice" v-if="admin.edit.id">
                                    <label>
                                        病区
                                        <input type="text" v-model="admin.edit.ward" required>
                                    </label>
                                    <label>
                                        床位号
                                        <input type="text" v-model="admin.edit.bedNumber" required>
                                    </label>
                                    <label>
                                        状态
                                        <select v-model="admin.edit.status">
                                            <option v-for="status in enums.deviceStatuses" :key="status" :value="status">{{ displayDeviceStatus(status) }}</option>
                                        </select>
                                    </label>
                                    <div class="button-row" style="margin-top:0;">
                                        <button type="submit">保存更改</button>
                                        <button type="button" class="secondary" @click="deleteDevice">删除设备</button>
                                    </div>
                                </form>
                                <p v-else class="muted" style="margin-top:1rem;">点击下方列表中的设备即可载入编辑表单。</p>
                                <table style="margin-top:1rem;">
                                    <thead>
                                        <tr>
                                            <th>编号</th>
                                            <th>位置</th>
                                            <th>状态</th>
                                            <th>锁状态</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="device in filteredAdminDevices" :key="device.id" @click="selectDeviceForEdit(device)">
                                            <td>{{ device.deviceCode }}</td>
                                            <td>{{ device.ward }} · {{ device.bedNumber }}</td>
                                            <td>{{ displayDeviceStatus(device.status) }}</td>
                                            <td>{{ displayLockStatus(device.lockStatus, device.status) }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </article>

                            <article class="card grid-span-full">
                                <h3>设备运维动作</h3>
                                <div class="form-inline">
                                    <label>
                                        目标设备
                                        <select v-model="admin.actionDeviceId">
                                            <option value="">选择设备</option>
                                            <option v-for="device in admin.devices" :key="device.id" :value="device.id">{{ device.deviceCode }}</option>
                                        </select>
                                    </label>
                                    <button @click="triggerReboot" type="button">远程重启</button>
                                </div>
                                <div class="form-inline" style="margin-top:1rem;">
                                    <label>
                                        故障描述
                                        <input type="text" v-model="admin.faultForm.description" placeholder="床体升降异常">
                                    </label>
                                    <button @click="submitFault" type="button">上报故障</button>
                                </div>
                            </article>

                            <article class="card grid-span-full">
                                <div class="section-title">
                                    <h3>租借订单</h3>
                                    <div class="button-row">
                                        <select v-model="admin.rentalStatusFilter">
                                            <option value="">全部状态</option>
                                            <option v-for="status in enums.rentalStatuses" :key="status" :value="status">{{ status }}</option>
                                        </select>
                                        <button class="btn-refresh" @click="refreshAdminRentals">刷新</button>
                                    </div>
                                </div>
                                <table class="table-compact">
                                    <thead>
                                        <tr>
                                            <th>订单号</th>
                                            <th>设备</th>
                                            <th>用户</th>
                                            <th>状态</th>
                                            <th>金额</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="rental in filteredAdminRentals" :key="rental.id">
                                            <td>{{ shortId(rental.id) }}</td>
                                            <td>{{ rental.deviceCode }}</td>
                                            <td>{{ shortId(rental.userId) }}</td>
                                            <td>{{ rental.status }}</td>
                                            <td>{{ formatNumber(rental.amount) }}</td>
                                            <td>
                                                <button v-if="rental.status === 'ACTIVE'" class="secondary" @click="cancelRentalAdmin(rental.id)">取消订单</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </article>

                            <article class="card">
                                <div class="section-title">
                                    <h3>费用争议</h3>
                                    <button class="btn-refresh" @click="refreshDisputes">刷新</button>
                                </div>
                                <form class="stack" style="margin-top:1rem;" @submit.prevent="submitDisputeUpdate">
                                    <label>
                                        争议单
                                        <select v-model="admin.disputeUpdate.id" required>
                                            <option value="">选择争议记录</option>
                                            <option v-for="dispute in admin.disputes" :key="dispute.id" :value="dispute.id">
                                                {{ dispute.orderId }} · {{ dispute.status }}
                                            </option>
                                        </select>
                                    </label>
                                    <label>
                                        状态
                                        <select v-model="admin.disputeUpdate.status" required>
                                            <option v-for="status in enums.disputeStatuses" :key="status" :value="status">{{ status }}</option>
                                        </select>
                                    </label>
                                    <label>
                                        处理说明
                                        <textarea rows="3" v-model="admin.disputeUpdate.resolution" required></textarea>
                                    </label>
                                    <button type="submit">提交处理结果</button>
                                </form>
                                <h4 style="margin-top:1.25rem;">全部争议</h4>
                                <ul class="list-plain">
                                    <li v-for="dispute in admin.disputes" :key="dispute.id">
                                        <strong>{{ dispute.orderId }}</strong> · {{ dispute.status }}
                                        <div class="muted">原因：{{ dispute.reason }}</div>
                                        <div class="muted" v-if="dispute.resolution">处理：{{ dispute.resolution }}</div>
                                    </li>
                                </ul>
                            </article>

                            <article class="card">
                                <div class="section-title">
                                    <h3>维修工单</h3>
                                    <button class="btn-refresh" @click="refreshAdminRepairs">刷新</button>
                                </div>
                                <form class="stack" style="margin-top:1rem;" @submit.prevent="submitRepairUpdate">
                                    <label>
                                        工单
                                        <select v-model="admin.repairUpdate.id" required>
                                            <option value="">选择维修工单</option>
                                            <option v-for="ticket in admin.repairs" :key="ticket.id" :value="ticket.id">
                                                {{ ticket.deviceCode }} · {{ ticket.status }}
                                            </option>
                                        </select>
                                    </label>
                                    <label>
                                        状态
                                        <select v-model="admin.repairUpdate.status" required>
                                            <option v-for="status in enums.repairStatuses" :key="status" :value="status">{{ status }}</option>
                                        </select>
                                    </label>
                                    <label>
                                        处理说明
                                        <textarea rows="3" v-model="admin.repairUpdate.resolution" required></textarea>
                                    </label>
                                    <button type="submit">更新工单</button>
                                </form>
                                <h4 style="margin-top:1.25rem;">工单列表</h4>
                                <ul class="list-plain">
                                    <li v-for="ticket in admin.repairs" :key="ticket.id">
                                        <strong>{{ ticket.deviceCode }}</strong> · {{ ticket.status }}
                                        <div class="muted">描述：{{ ticket.description }}</div>
                                        <div class="muted">创建：{{ formatTime(ticket.createdAt) }}</div>
                                    </li>
                                </ul>
                            </article>

                            <article class="card">
                                <div class="section-title">
                                    <h3>通知广播</h3>
                                    <button class="btn-refresh" @click="refreshAdminMessages">刷新</button>
                                </div>
                                <ul class="list-plain" style="margin-top:1rem;">
                                    <li v-for="msg in admin.adminMessages" :key="msg.id">
                                        <strong>{{ msg.title }}</strong> · {{ msg.type }}
                                        <div class="muted">{{ formatTime(msg.createdAt) }}</div>
                                        <p>{{ msg.content }}</p>
                                    </li>
                                </ul>
                            </article>

                            <article class="card">
                                <div class="section-title">
                                    <h3>用户列表</h3>
                                    <button class="btn-refresh" @click="refreshUsers">刷新</button>
                                </div>
                                <table style="margin-top:1rem;">
                                    <thead>
                                        <tr>
                                            <th>姓名</th>
                                            <th>角色</th>
                                            <th>手机号</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="user in admin.users" :key="user.id">
                                            <td>{{ user.fullName || user.username }}</td>
                                            <td>{{ user.role }}</td>
                                            <td>{{ user.phone || '-' }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </article>
                        </div>
                    </section>
                </section>
            </div>

            <section class="log-grid" v-if="showLogCards">
                <article class="card log-card">
                    <h2>API 请求日志</h2>
                    <pre>{{ logs.slice().reverse().join('\n') || '暂无请求记录' }}</pre>
                </article>
                <article class="card log-card">
                    <h2>MQTT 日志</h2>
                    <pre>{{ mqttLogs.slice().reverse().join('\n') || '暂无MQTT记录' }}</pre>
                </article>
            </section>

            <nav class="mobile-bottom-nav" v-if="mobileNavVisible">
                <button :class="{ active: mobileTab === 'devices' }" @click="switchMobileTab('devices')">
                    <i class="fa-solid fa-bed nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">设备</span>
                    <span class="nav-sub">状态</span>
                </button>
                <button :class="{ active: mobileTab === 'orders' }" @click="switchMobileTab('orders')">
                    <i class="fa-solid fa-clipboard-list nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">订单</span>
                    <span class="nav-sub">租借·报修</span>
                </button>
                <button :class="{ active: mobileTab === 'messages' }" @click="switchMobileTab('messages')">
                    <i class="fa-solid fa-bell nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">消息</span>
                    <span class="nav-sub">通知</span>
                </button>
                <button :class="{ active: mobileTab === 'mine' }" @click="switchMobileTab('mine')">
                    <i class="fa-solid fa-user nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">我的</span>
                    <span class="nav-sub">钱包</span>
                </button>
            </nav>
        </template>
    </main>
</div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
    <script type="module" src="./assets/js/bootstrap/main.js"></script>
</body>
</html>
