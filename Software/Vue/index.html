<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>码上安睡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1.5.10/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
        <link rel="stylesheet" href="./assets/css/main.css?v=18">
        <span style="white-space:pre">	</span><link href="https://msas.absozero.cn/favicon.ico" rel="icon" type="image/x-icon" />
</head>
<body>
<div id="app">
    <section class="hero">
        <div class="hero-inner">
            <div class="hero-legend" v-if="!session.token">
                <span class="eyebrow">CAREBED PLATFORM</span>
                <h1>欢迎使用</h1>
                 <h1>码上安睡共享陪护床系统</h1>
            </div>
            <div class="hero-meta">
                <div class="hero-meta-group">
                </div>
            </div>
        </div>
    </section>

    <main class="app-shell" :class="{ 'has-mobile-nav': mobileNavVisible }">
        <article class="card auth-card" v-if="!session.token">
            <div class="auth-switch">
                <button type="button" :class="{ active: authCard === 'login' }" @click="switchAuthCard('login')">登录账号</button>
                <button type="button" :class="{ active: authCard === 'register' }" @click="switchAuthCard('register')">注册账号</button>
            </div>
  <!-- 登录表单 -->
            <template v-if="authCard === 'login'">
                <h2>登录</h2>
                <form @submit.prevent="handleLogin" class="stack">
                    <label>
                        用户名
                        <input type="text" v-model="loginForm.username" placeholder="请输入用户名" required>
                    </label>
                    <label>
                        密码
                        <input type="password" v-model="loginForm.password" placeholder="请输入密码" required>
                    </label>
                    <button type="submit">登录</button>
                </form>
                
                <p class="auth-hint">
                    忘记密码？
                    <button type="button" class="link-button" @click="switchAuthCard('reset')">点击找回</button>
                </p>
            </template>

            <template v-else-if="authCard === 'reset'">
                <h2>重置密码</h2>
                <form @submit.prevent="handleResetPassword" class="stack">
                    <label>
                        用户名
                        <input type="text" v-model="resetForm.username" placeholder="请输入用户名" required>
                    </label>
                    <label>
                        手机号
                        <input type="tel" v-model="resetForm.phone" placeholder="请输入手机号" required>
                    </label>
                    <label>
                        新密码
                        <input type="password" v-model="resetForm.newPassword" placeholder="请输入新密码" required>
                    </label>
                    <button type="submit">重置密码</button>
                </form>
                <p class="auth-hint">
                    <button type="button" class="link-button" @click="switchAuthCard('login')">返回登录</button>
                </p>
                
                <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #eee;">
                    <div class="github-badge-big">
                        <span class="badge-subject1">ICP备案</span>
                        <span class="badge-value bg-blue">
                            <a href="https://beian.miit.gov.cn/" target="_blank" style="color: white; text-decoration: none;">陇ICP备2024013668号</a>
                        </span>
                    </div>
                    <br>
                    <div class="github-badge-big">
                        <span class="badge-subject">
                            <img src="https://beian.mps.gov.cn/web/assets/logo01.6189a29f.png" height="16" width="15" style="vertical-align: middle;"/>
                        </span>
                        <span class="badge-value1 bg-orange">
                            <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=62082102202094" target="_blank" style="color: white; text-decoration: none;">甘公网安备62082102202094号</a>
                        </span>
                    </div>
                </div>
            </template>

            <template v-else>
                <h2>注册新账号</h2>
                <form @submit.prevent="handleRegister" class="stack">
                    <label>
                        用户名
                        <input type="text" v-model="registerForm.username" placeholder="请输入用户名" required>
                    </label>
                    <label>
                        密码
                        <input type="password" v-model="registerForm.password" placeholder="请输入密码" required>
                    </label>
                    <label>
                        姓名
                        <input type="text" v-model="registerForm.fullName" placeholder="请输入姓名" required>
                    </label>
                    <label>
                        手机号
                        <input type="tel" v-model="registerForm.phone" placeholder="请输入手机号" required>
                    </label>
                    <button type="submit">注册并登录</button>
                </form>
                <p class="auth-hint">
                    已有账号？
                    <button type="button" class="link-button" @click="switchAuthCard('login')">返回登录</button>
                </p>
            </template>
        </article>

        <template v-else>
            <div class="dashboard-shell">
                <aside class="session-panel">
                    <article class="card" v-if="showTokenCard">
                        <div class="panel-heading" style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h2>{{ session.displayName }}</h2>
                                <p>{{ displayUserRole(session.role) }}</p>
                            </div>
                                <button class="secondary" @click="logout" style="margin-left: 10px; padding: 6px 8px; font-size: 16px; width: 160px; text-align: center; white-space: nowrap;">退出登录</button>
                        </div>
                    </article>
                    <article class="card admin-nav-card" v-if="canSeeAdmin && activeArea === 'admin' && !isMobile">
                        <h3 class="admin-nav-title">管理菜单</h3>
                        <nav class="admin-nav-list" aria-label="管理员左侧菜单">
                            <button type="button" class="admin-nav-item" :class="{ active: adminDesktopTab === 'overview' }" @click="switchAdminDesktopTab('overview')">
                                <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
                                <span>运营总览</span>
                            </button>
                            <button type="button" class="admin-nav-item" :class="{ active: adminDesktopTab === 'devices' }" @click="switchAdminDesktopTab('devices')">
                                <i class="fa-solid fa-bed" aria-hidden="true"></i>
                                <span>设备管理</span>
                            </button>
                            <button type="button" class="admin-nav-item" :class="{ active: adminDesktopTab === 'services' }" @click="switchAdminDesktopTab('services')">
                                <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>
                                <span>服务管理</span>
                            </button>
                            <button type="button" class="admin-nav-item" :class="{ active: adminDesktopTab === 'system' }" @click="switchAdminDesktopTab('system')">
                                <i class="fa-solid fa-cog" aria-hidden="true"></i>
                                <span>用户与通知管理</span>
                            </button>
                        </nav>
                    </article>
                </aside>

                <section class="area-content">
                    <section class="area-pane" v-if="activeArea === 'customer' && canSeeCustomer">
                         <article class="card" v-if="showMobileSection('devices')">
                                <div class="area-header-top">
                                    <h2>🛏️ 快速租借</h2>
                                    <div class="time-indicator">当前北京时间：{{ beijingTime }}</div>
                                </div>
                            </article>
                        <div class="area-grid">
                            <!-- 钱包与充值卡片（仅余额和充值） -->
                            <article class="card" v-if="showMobileSection('mine')">
                                <div class="section-title">
                                    <h3>💰 钱包与充值</h3>
                                    <button class="btn-refresh" @click="refreshWallet">刷新</button>
                                </div>
                                <div v-if="customer.wallet" style="margin-bottom: 0.75rem; padding: 0.75rem; background: #f0f7ff; border-radius: 6px; border-left: 4px solid #0d6efd;">
                                    <div style="margin-bottom: 0.25rem;">当前余额：<strong style="font-size: 1.2rem; color: #0d6efd;">{{ formatNumber(customer.wallet.balance) }} 元</strong></div>
                                    <div class="muted" style="font-size: 0.85rem;">最近更新：{{ formatTime(customer.wallet.updatedAt) }}</div>
                                </div>
                                <p v-else class="muted" style="margin-bottom: 0.75rem;">尚未拉取钱包信息，点击刷新即可同步。</p>
                                <form class="form-inline" style="margin-bottom: 0.75rem;" @submit.prevent="submitRecharge">
                                    <label style="margin-bottom: 0.5rem;">
                                        充值金额
                                        <input type="number" min="1" step="1" v-model.number="customer.rechargeAmount" required>
                                    </label>
                                    <button type="submit">充值</button>
                                </form>
                            </article>

                            <!-- 交易记录与费用争议合并卡片 -->
                            <article class="card" v-if="showMobileSection('mine')">
                                <div class="section-title">
                                    <h3>📑 交易记录与费用争议</h3>
                                </div>
                                <h4 style="margin-top: 0.75rem; margin-bottom: 0.5rem;">交易记录</h4>
                                <template v-if="customer.wallet &amp;&amp; Array.isArray(customer.wallet.transactions) &amp;&amp; customer.wallet.transactions.length">
                                    <table>
                                    <thead>
                                        <tr>
                                            <th>时间</th>
                                            <th style="white-space: nowrap;">类型</th>
                                            <th>金额</th>
                                            <th>备注</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="txn in pagedWalletTransactions" :key="txn.id">
                                            <td>{{ formatTime(txn.occurredAt) }}</td>
                                            <td class="nowrap">{{ displayTransactionType(txn.type) }}</td>
                                            <td>{{ formatNumber(txn.amount) }}</td>
                                            <td>{{ txn.reference || txn.notes }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div class="pager" v-if="transactionsTotalPages > 1">
                                    <div style="text-align: center; margin-bottom: 8px;"><span class="pager-info">第 {{ pagination.transactions }} / {{ transactionsTotalPages }} 页</span></div>
                                    <div style="display: flex; justify-content: center; gap: 10px;">
                                        <button type="button" class="secondary" :disabled="pagination.transactions === 1" @click="changePage('transactions', -1, transactionsTotalPages)">上一页</button>
                                        <button type="button" class="secondary" :disabled="pagination.transactions === transactionsTotalPages" @click="changePage('transactions', 1, transactionsTotalPages)">下一页</button>
                                    </div>
                                </div>
                                </template>
                                <p v-else class="muted">暂无交易记录。</p>
                                <h4 style="margin-top:1.25rem; margin-bottom: 0.5rem;">⚠️ 费用争议 <span v-if="customer.disputes.filter(d => d.status === 'OPEN').length" style="font-size: 0.85rem; color: #dc3545;">({{ customer.disputes.filter(d => d.status === 'OPEN').length }} 待处理)</span></h4>
                                <form class="stack" @submit.prevent="submitDispute" style="margin-bottom: 0.75rem;">
                                    <label>
                                        订单号
                                        <!-- 微信浏览器使用自定义弹窗 -->
                                        <div v-if="isWechat" class="custom-select-container">
                                            <div class="custom-select" @click="toggleOrderSelect">
                                                <input type="text" :value="selectedOrderText" readonly placeholder="选择订单号" class="select-input">
                                                <span class="select-arrow">▼</span>
                                            </div>
                                            <!-- 固定在页面中间的选择弹窗 -->
                                            <div v-if="customer.showOrderSelect" class="select-modal-overlay" @click="customer.showOrderSelect = false">
                                                <div class="select-modal" @click.stop>
                                                    <div class="select-header">
                                                        <span>选择订单号</span>
                                                        <span class="select-close" @click="customer.showOrderSelect = false">&times;</span>
                                                    </div>
                                                    <div class="select-options">
                                                        <div v-for="rental in customer.rentals" :key="rental.id"
                                                             class="select-option" @click="customer.disputeForm.orderId = rental.id; customer.showOrderSelect = false">
                                                                <span class="option-text">{{ rentalShortId(rental.id) }} · {{ displayRentalStatus(rental.status) }} · {{ formatTime(rental.startedAt || rental.createdAt) }}</span>
                                                                <span class="option-check" v-if="customer.disputeForm.orderId === rental.id">✓</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <!-- 其他浏览器使用原生select -->
                                        <select v-else v-model="customer.disputeForm.orderId" required>
                                            <option value="">选择订单号</option>
                                            <option v-for="rental in customer.rentals" :key="rental.id" :value="rental.id">
                                                {{ rentalShortId(rental.id) }} · {{ displayRentalStatus(rental.status) }} · {{ formatTime(rental.startedAt || rental.createdAt) }}
                                            </option>
                                        </select>
                                    </label>
                                    <label>
                                        申诉原因
                                        <textarea rows="3" v-model="customer.disputeForm.reason" required></textarea>
                                    </label>
                                    <button type="submit">提交争议</button>
                                </form>
                                <div style="margin-bottom: 0.5rem;">
                                    <button type="button" class="secondary" @click="toggleDisputeHistory">
                                        查看历史争议
                                    </button>
                                </div>
                                <div class="device-edit-modal" v-if="showAllDisputes" @click="showAllDisputes = false">
                                    <article class="card device-edit-modal-card" @click.stop>
                                        <div class="section-title device-edit-title" style="margin-bottom: 0.5rem;">
                                            <h3>历史争议记录</h3>
                                            <span class="device-edit-close" role="button" tabindex="0" aria-label="关闭弹窗" @click="showAllDisputes = false" @keydown.enter="showAllDisputes = false" @keydown.space.prevent="showAllDisputes = false">&times;</span>
                                        </div>
                                        <p v-if="isLoadingDisputes" class="muted">正在加载历史争议...</p>
                                        <div v-else style="margin-bottom: 0.75rem;">
                                            <label style="margin-bottom: 0;">
                                                状态筛选
                                                <select v-model="customer.disputeStatusFilter">
                                                    <option value="">全部状态</option>
                                                    <option value="OPEN">待处理</option>
                                                    <option value="IN_REVIEW">处理中</option>
                                                    <option value="RESOLVED">已解决</option>
                                                </select>
                                            </label>
                                        </div>
                                        <ul class="list-plain" v-if="!isLoadingDisputes">
                                            <li v-if="!filteredCustomerDisputes.length" class="muted">暂无历史争议。</li>
                                            <li v-for="dispute in filteredCustomerDisputes" :key="dispute.id" style="padding: 0.5rem; border-left: 3px solid; margin-bottom: 0.5rem;" :style="{borderColor: disputeStatusColor(dispute.status)}">
                                                <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 0.5rem;" :style="{background: disputeStatusColor(dispute.status)}"></span>
                                                <strong>订单号：</strong>{{ dispute.orderId }}
                                                <span style="margin-left: 0.5rem;">状态：{{ displayDisputeStatus(dispute.status) }}</span>
                                                <div class="muted" style="font-size: 0.85rem;">原因：{{ dispute.reason }}</div>
                                                <div class="muted" v-if="dispute.resolution" style="font-size: 0.85rem;">处理：{{ dispute.resolution }}</div>
                                                <div class="muted" style="font-size: 0.8rem;">提交时间：{{ formatTime(dispute.createdAt) }}</div>
                                            </li>
                                        </ul>
                                    </article>
                                </div>
                            </article>

                           

                            <article class="card" v-if="showMobileSection('devices')">
                                <p v-if="lockedDeviceCode && !isAdmin" class="muted" style="margin:0.5rem 0;">已锁定设备：{{ lockedDeviceCode }}（来源二维码）</p>
                                
                                <!-- 当前租借状态 -->
                                <div v-if="currentRental" class="rental-timer">
                                    <h3>当前租借</h3>
                                    <div class="timer-display">
                                        <p>设备：{{ currentRental.deviceCode }}</p>
                                        <p class="timer">已使用：{{ formatRentalDuration(currentRental.startedAt) }}</p>
                                        <p>预计费用：{{ calculateRentalFee(currentRental.startedAt) }} 元</p>
                                    </div>
                                    <div class="rental-actions-row">
                                        <button type="button" @click="toggleTemporaryLock(currentRental)" class="temp-lock-button" :class="{ active: isTemporaryLocked }" :disabled="returningRentalId === currentRental.id">
                                            {{ isTemporaryLocked ? '🔓 解锁' : '🔒 临时关锁' }}
                                        </button>
                                        <button type="button" @click="returnRental(currentRental.id)" class="return-button" :disabled="returningRentalId === currentRental.id">
                                            {{ returningRentalId === currentRental.id ? '归还处理中...' : '归还设备' }}
                                        </button>
                                    </div>
                                    <div v-if="isTemporaryLocked" class="temp-lock-hint">
                                        ⚠️ 设备已临时关锁，计时计费继续进行中
                                    </div>
                                </div>
                                
                                <!-- 租借选项 -->
                                <div v-else>
                                    <div class="rental-option">
                                        <button type="button" :class="{ active: rentalOption === 'manual' }" @click="rentalOption = 'manual'">手动选择</button>
                                        <button type="button" :class="{ active: rentalOption === 'scan' }" @click="enterScanMode">扫码租借</button>
                                    </div>
                                    
                                    <form class="stack" @submit.prevent="startRental" v-if="rentalOption === 'manual'">
                                        <label>
                                            设备编号
                                            <!-- 微信浏览器使用自定义弹窗 -->
                                            <div v-if="isWechat" class="custom-select-container">
                                                <div class="custom-select" @click="toggleDeviceSelect">
                                                    <input type="text" :value="selectedDeviceText" readonly placeholder="请选择设备" class="select-input" :disabled="!!lockedDeviceCode && !isAdmin">
                                                    <span class="select-arrow">▼</span>
                                                </div>
                                                <!-- 固定在页面中间的选择弹窗 -->
                                                <div v-if="customer.showDeviceSelect" class="select-modal-overlay" @click="customer.showDeviceSelect = false">
                                                    <div class="select-modal" @click.stop>
                                                        <div class="select-header">
                                                            <span>请选择设备</span>
                                                            <span class="select-close" @click="customer.showDeviceSelect = false">&times;</span>
                                                        </div>
                                                        <div class="select-options">
                                                            <div v-for="device in customer.devices.filter(d => d.status === 'AVAILABLE')" :key="device.id"
                                                                 class="select-option" @click="customer.rentalForm.deviceCode = device.deviceCode; customer.showDeviceSelect = false">
                                                                    <span class="option-text">{{ device.deviceCode }} ({{ device.ward }}·床位 {{ device.bedNumber }})</span>
                                                                    <span class="option-check" v-if="customer.rentalForm.deviceCode === device.deviceCode">✓</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <!-- 其他浏览器使用原生select -->
                                            <select v-else v-model="customer.rentalForm.deviceCode" required :disabled="!!lockedDeviceCode && !isAdmin">
                                                <option value="" disabled selected>请选择设备</option>
                                                <option v-for="device in customer.devices.filter(d => d.status === 'AVAILABLE')" :key="device.id" :value="device.deviceCode">
                                                    {{ device.deviceCode }} ({{ device.ward }}·床位 {{ device.bedNumber }})
                                                </option>
                                            </select>
                                        </label>
                                        <button type="submit">发起租借</button>
                                    </form>
                                    
                                    <div class="scan-section" v-else-if="rentalOption === 'scan'">
                                        <div id="qr-scanner" style="width: 100%; max-width: 300px; margin: 0 auto;">
                                            <video id="preview" autoplay playsinline muted style="width: 100%; border-radius: 8px;"></video>
                                        </div>
                                        <p class="muted" style="text-align: center; margin: 1rem 0;">请将摄像头对准二维码</p>
                                        <button type="button" @click="startScan">开始扫码</button>
                                        <button type="button" @click="stopScan" v-if="scanning">停止扫码</button>
                                    </div>
                                </div>
                            </article>

                            <article class="card horizontal-card" v-if="showMobileSection('devices')">
                                <div class="section-title">
                                    <h3>空闲设备 (共 {{ customer.devices.filter(d => d.status === 'AVAILABLE').length }} 台)</h3>
                                    <button class="btn-refresh" @click="refreshCustomerDevices">刷新</button>
                                </div>
                                <input v-if="customer.devices.length > 3" type="text" v-model="customer.deviceSearchKeyword" placeholder="搜索设备编号或病区..." style="width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; border: 1px solid #ddd;">
                                <ul class="list-plain device-list">
                                    <li v-for="device in filteredCustomerDevices" :key="device.id">
                                        <span class="status-dot" :class="`status-${device.status}`"></span>
                                        <div class="device-entry-head">
                                            <strong>{{ device.deviceCode }}</strong>
                                            <span class="badge">{{ displayDeviceStatus(device.status) }}</span>
                                        </div>
                                        <div class="muted">{{ device.ward }}·床位 {{ device.bedNumber }}</div>
                                        <div class="muted" style="font-size: 0.85rem;">锁定：{{ displayLockStatus(device.lockStatus, device.status) }}</div>
                                    </li>
                                </ul>
                                <p v-if="filteredCustomerDevices.length === 0" class="muted" style="text-align: center;">当前暂无空闲设备</p>
                                <div class="pager" v-if="devicesTotalPages > 1" style="display: flex; flex-direction: column; align-items: center;">
                                    <span class="pager-info" style="margin-bottom: 5px;">第 {{ pagination.devices }} / {{ devicesTotalPages }} 页</span>
                                    <div style="display: flex; gap: 10px;">
                                        <button type="button" class="secondary" :disabled="pagination.devices === 1" @click="changePage('devices', -1, devicesTotalPages)">上一页</button>
                                        <button type="button" class="secondary" :disabled="pagination.devices === devicesTotalPages" @click="changePage('devices', 1, devicesTotalPages)">下一页</button>
                                    </div>
                                </div>
                            </article>

                            <article class="card" v-if="showMobileSection('orders')">
                                <div class="section-title">
                                    <h3>📋 租借记录 (共 {{ customer.rentals.length }} 个)</h3>
                                </div>
                                <table class="table-compact rentals-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 20px;"></th>
                                            <th class="nowrap">订单号</th>
                                            <th>状态</th>
                                            <th class="nowrap">时长</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template v-for="rental in pagedCustomerRentals" :key="rental.id">
                                            <tr>
                                                <td style="text-align: center;">

                                        <div v-if="currentAdminRepair" style="margin-bottom: 0.25rem; padding: 0.65rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;">
                                            <div><strong>设备编号：</strong>{{ currentAdminRepair.deviceCode }}</div>
                                            <div class="muted" style="margin-top: 0.35rem;"><strong>故障描述：</strong>{{ currentAdminRepair.description }}</div>
                                            <div class="muted" style="margin-top: 0.25rem;"><strong>提交时间：</strong>{{ formatTime(currentAdminRepair.createdAt) }}</div>
                                            <!-- 故障照片显示已注释掉 -->
                                            <!-- <div class="repair-photo-grid" v-if="currentAdminRepair.photos && currentAdminRepair.photos.length" style="margin-top: 0.5rem;">
                                                <div class="repair-photo-item" v-for="(photo, index) in currentAdminRepair.photos" :key="index">
                                                    <img :src="photo" :alt="'故障照片 ' + (index + 1)" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px;">
                                                </div>
                                            </div> -->
                                        </div>
                                        <form class="stack" @submit.prevent="submitRepairUpdate">
                                            <label>
                                                状态
                                                <select v-model="admin.repairUpdate.status" required>
                                                    <option v-for="status in enums.repairStatuses" :key="status" :value="status">{{ displayRepairStatus(status) }}</option>
                                                </select>
                                            </label>
                                            <label>
                                                处理说明
                                                <textarea rows="3" v-model="admin.repairUpdate.resolution" required></textarea>
                                            </label>
                                            <div class="button-row device-edit-actions" style="margin-top:0;">
                                                <button type="submit">更新工单</button>
                                                <button type="button" class="secondary" @click="closeRepairEditModal">取消</button>
                                            </div>
                                        </form>
                                    </article>
                                </div>
                            </article>

                            <!-- 系统管理统计摘要 -->
                            <article class="card grid-span-full" v-if="showAdminSection('system')">
                                <div class="section-title">
                                    <h3>📊 系统统计</h3>
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem;">
                                    <div style="padding: 1rem; background: #e7e7ff; border-radius: 8px; text-align: center;">
                                        <div style="font-size: 0.9rem; color: #330066;">👥 用户总数</div>
                                        <div style="font-size: 1.8rem; font-weight: bold; color: #6f42c1;">{{ admin.users.length }}</div>
                                        <div style="font-size: 0.75rem; color: #666; margin-top: 0.25rem;">
                                            <span style="display: block;">家属 {{ admin.users.filter(u => u.role === 'FAMILY').length }}</span>
                                        </div>
                                    </div>
                                    <div style="padding: 1rem; background: #fff0e7; border-radius: 8px; text-align: center;">
                                        <div style="font-size: 0.9rem; color: #cc6600;">👔 管理员</div>
                                        <div style="font-size: 1.8rem; font-weight: bold; color: #ff9800;">{{ admin.users.filter(u => u.role === 'ADMIN').length }}</div>
                                    </div>
                                    <div style="padding: 1rem; background: #e7f5e7; border-radius: 8px; text-align: center;">
                                        <div style="font-size: 0.9rem; color: #006600;">📢 通知</div>
                                        <div style="font-size: 1.8rem; font-weight: bold; color: #198754;">{{ admin.adminMessages.length }}</div>
                                        <div style="font-size: 0.75rem; color: #666; margin-top: 0.25rem;">
                                            <span style="display: block;" v-if="admin.adminMessages.length">最新 {{ admin.adminMessages.slice(0, 1).map(m => formatTime(m.createdAt)).join() }}</span>
                                        </div>
                                    </div>
                                </div>
                            </article>

                            <article class="card" v-if="showAdminSection('system')">
                                <div class="section-title">
                                    <h3>👥 用户列表</h3>
                                    <input type="text" v-model="admin.userSearchKeyword" placeholder="搜索姓名或手机号..." style="flex: 1; min-width: 150px; padding: 0.5rem;" @input="refreshUsers(1, admin.userSearchKeyword)">
                                    <button class="btn-refresh" @click="refreshUsers(1, admin.userSearchKeyword)">刷新</button>
                                </div>
                                <p class="muted" style="margin-top: 0rem; margin-bottom: 0.5rem;">共 {{ admin.users.length }} 个用户（每页最多展示10人）</p>
                                <table style="margin-top: 0rem; width: 100%; font-size: 1.05rem;">
                                    <thead>
                                        <tr>
                                            <th style="padding: 1rem; font-size: 1.1rem; width: 30px;"></th>
                                            <th style="padding: 1rem; font-size: 1.1rem;">姓名</th>
                                            <th style="padding: 1rem; font-size: 1.1rem;">角色</th>
                                            <th style="padding: 1rem; font-size: 1.1rem;">手机号</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="user in pagedAdminUsers" :key="user.id" style="min-height: 3rem; cursor: pointer;" @click="openUserEditModal(user)">
                                            <td style="padding: 1rem; text-align: center;">
                                                <span style="display: inline-block; width: 12px; height: 12px; border-radius: 50%;" :style="{background: user.role === 'ADMIN' ? '#ff9800' : '#6f42c1'}"></span>
                                            </td>
                                            <td style="padding: 1rem;"><strong>{{ user.fullName || user.username }}</strong></td>
                                            <td style="padding: 1rem;">{{ displayUserRole(user.role) }}</td>
                                            <td style="padding: 1rem;">{{ user.phone || '-' }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div class="pager" v-if="adminUsersTotalPages > 1">
                                    <div style="text-align: center; margin-bottom: 8px;"><span class="pager-info">第 {{ pagination.adminUsers || 1 }} / {{ adminUsersTotalPages }} 页</span></div>
                                    <div style="display: flex; justify-content: center; gap: 10px;">
                                        <button type="button" class="secondary" :disabled="pagination.adminUsers === 1" @click="changePage('adminUsers', -1, adminUsersTotalPages)">上一页</button>
                                        <button type="button" class="secondary" :disabled="pagination.adminUsers === adminUsersTotalPages" @click="changePage('adminUsers', 1, adminUsersTotalPages)">下一页</button>
                                    </div>
                                </div>
                                <!-- 用户编辑弹窗 -->
                                <div class="device-edit-modal" v-if="admin.userEditModalVisible" @click="admin.userEditModalVisible = false">
                                    <article class="card device-edit-modal-card" @click.stop>
                                        <div class="section-title device-edit-title" style="margin-bottom: 0.5rem;">
                                            <h3>编辑用户</h3>
                                            <span class="device-edit-close" role="button" tabindex="0" aria-label="关闭弹窗" @click="admin.userEditModalVisible = false" @keydown.enter="admin.userEditModalVisible = false" @keydown.space.prevent="admin.userEditModalVisible = false">&times;</span>
                                        </div>
                                        <form class="stack" @submit.prevent="submitUserEdit">
                                            <label>用户名
                                                <input type="text" v-model="admin.userEditForm.username" placeholder="留空不修改">
                                            </label>
                                            <label>姓名
                                                <input type="text" v-model="admin.userEditForm.fullName" placeholder="留空不修改">
                                            </label>
                                            <label>手机号
                                                <input type="tel" v-model="admin.userEditForm.phone" placeholder="留空不修改">
                                            </label>
                                            <div class="button-row" style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                                                <button type="submit" style="flex:1;">保存修改</button>
                                                <button type="button" class="secondary" @click="admin.userEditForm.showResetPwd = !admin.userEditForm.showResetPwd" style="flex:1;">🔑 重置密码</button>
                                                <button type="button" class="secondary" @click="admin.userEditForm.showSetBalance = !admin.userEditForm.showSetBalance" style="flex:1;">💰 改余额</button>
                                                <button type="button" class="secondary" @click="admin.userEditForm.showDelete = !admin.userEditForm.showDelete" style="flex:1;color:#dc3545;">🗑️ 注销</button>
                                            </div>
                                            <div v-if="admin.userEditForm.showResetPwd" style="margin-top:0.5rem;">
                                                <label>新密码
                                                    <input type="password" v-model="admin.userEditForm.newPassword" placeholder="输入新密码（至少6位）">
                                                </label>
                                                <button type="button" class="secondary" @click="submitUserPassword">确认重置密码</button>
                                            </div>
                                            <div v-if="admin.userEditForm.showSetBalance" style="margin-top:0.5rem;">
                                                <label>新余额（元）
                                                    <input type="number" min="0" step="0.01" v-model="admin.userEditForm.newBalance" placeholder="输入新余额">
                                                </label>
                                                <button type="button" class="secondary" @click="submitUserBalance">确认修改余额</button>
                                            </div>
                                            <div v-if="admin.userEditForm.showDelete" style="margin-top:0.5rem;padding:0.5rem;background:#fff5f5;border-radius:4px;">
                                                <p style="color:#dc3545;">⚠️ 确定要注销此账户吗？不可恢复！</p>
                                                <button type="button" style="background:#dc3545;color:#fff;border:none;border-radius:4px;padding:0.5rem 1rem;" @click="submitUserDelete">确认注销</button>
                                                <button type="button" class="secondary" @click="admin.userEditForm.showDelete = false">取消</button>
                                            </div>
                                        </form>
                                    </article>
                                </div>
                            </article>

                            <article class="card" v-if="showAdminSection('system')">
                                <div class="section-title">
                                    <h3>📢 通知广播 (共 {{ admin.adminMessages.length }} 条)</h3>
                                    <button class="btn-refresh" @click="refreshAdminMessages">刷新</button>
                                </div>
                                <ul class="list-plain" style="margin-top:1rem;">
                                    <li v-for="msg in pagedAdminMessages" :key="msg.id" style="padding: 0.75rem; border-left: 4px solid #6f42c1; border-radius: 4px; margin-bottom: 0.5rem;">
                                        <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6f42c1; margin-right: 0.5rem;"></span>
                                        <strong>{{ msg.title }}</strong>
                                        <span style="font-size: 0.85rem; color: #666; margin-left: 0.5rem;">· {{ displayNotificationType(msg.type) }}</span>
                                        <div class="muted" style="font-size: 0.85rem; margin-top: 0.25rem;">{{ formatTime(msg.createdAt) }}</div>
                                        <p style="margin-top: 0.5rem; margin-bottom: 0;">{{ msg.content }}</p>
                                    </li>
                                </ul>
                                <div class="pager" v-if="adminMessagesTotalPages > 1">
                                    <div style="text-align: center; margin-bottom: 8px;"><span class="pager-info">第 {{ pagination.adminMessages || 1 }} / {{ adminMessagesTotalPages }} 页</span></div>
                                    <div style="display: flex; justify-content: center; gap: 10px;">
                                        <button type="button" class="secondary" :disabled="pagination.adminMessages === 1" @click="changePage('adminMessages', -1, adminMessagesTotalPages)">上一页</button>
                                        <button type="button" class="secondary" :disabled="pagination.adminMessages === adminMessagesTotalPages" @click="changePage('adminMessages', 1, adminMessagesTotalPages)">下一页</button>
                                    </div>
                                </div>
                            </article>
                        </div>
                    </section>
                </section>
            </div>

            <!-- <section class="log-grid" v-if="showLogCards">
                <article class="card log-card">
                    <h2>API 请求日志</h2>
                    <pre>{{ logs.slice().reverse().join('\n') || '暂无请求记录' }}</pre>
                </article>
                <article class="card log-card">
                    <h2>MQTT 日志</h2>
                    <pre>{{ mqttLogs.slice().reverse().join('\n') || '暂无MQTT记录' }}</pre>
                </article>
            </section> -->

            <nav class="mobile-bottom-nav" v-if="mobileNavVisible && !isAdmin">
                <button type="button" :class="{ active: mobileTab === 'devices' }" @click="switchMobileTab('devices')">
                    <i class="fa-solid fa-bed nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">设备</span>
                    <!-- <span class="nav-sub">状态</span> -->
                </button>
                <button type="button" :class="{ active: mobileTab === 'orders' }" @click="switchMobileTab('orders')">
                    <i class="fa-solid fa-clipboard-list nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">订单</span>
                    <!-- <span class="nav-sub">租借·报修</span> -->
                </button>
                <button type="button" :class="{ active: mobileTab === 'messages' }" @click="switchMobileTab('messages')">
                    <i class="fa-solid fa-bell nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">消息</span>
                    <!-- <span class="nav-sub">通知</span> -->
                </button>
                <button type="button" :class="{ active: mobileTab === 'mine' }" @click="switchMobileTab('mine')">
                    <i class="fa-solid fa-user nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">我的</span>
                    <!-- <span class="nav-sub">钱包</span> -->
                </button>
            </nav>
            <nav class="mobile-bottom-nav" v-if="mobileNavVisible && isAdmin">
                <button type="button" :class="{ active: adminMobileTab === 'overview' }" @click="switchAdminMobileTab('overview')">
                    <i class="fa-solid fa-chart-pie nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">概览</span>
                    <!-- <span class="nav-sub">统计·分析</span> -->
                </button>
                <button type="button" :class="{ active: adminMobileTab === 'devices' }" @click="switchAdminMobileTab('devices')">
                    <i class="fa-solid fa-bed nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">设备</span>
                    <!-- <span class="nav-sub">管理</span> -->
                </button>
                <button type="button" :class="{ active: adminMobileTab === 'services' }" @click="switchAdminMobileTab('services')">
                    <i class="fa-solid fa-clipboard-list nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">服务</span>
                    <!-- <span class="nav-sub">订单·维修</span> -->
                </button>
                <button type="button" :class="{ active: adminMobileTab === 'system' }" @click="switchAdminMobileTab('system')">
                    <i class="fa-solid fa-cog nav-icon" aria-hidden="true"></i>
                    <span class="nav-label">系统</span>
                    <!-- <span class="nav-sub">用户·通知</span> -->
                </button>
            </nav>
        </template>
    </main>
    
</div>

<script>new VConsole();</script> -->
